server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/campus_rag?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql
      encoding: UTF-8
      continue-on-error: false
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-before-sharing-32bytes}
  token-seconds: 7200
  storage: ${STORAGE_PATH:./data/files}
  # Exact frontend origins: scheme + hostname + port. Override for other frontend addresses.
  cors-origin: ${CORS_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  seed: false
  vector-store: ${VECTOR_STORE:qdrant}
  vector-namespace: ${VECTOR_NAMESPACE:campus}
  qdrant-url: ${QDRANT_URL:http://127.0.0.1:6333}
  qdrant-api-key: ${QDRANT_API_KEY:}
  qdrant-timeout-seconds: ${QDRANT_TIMEOUT_SECONDS:5}
  model-mode: ${MODEL_MODE:demo}
  model-base-url: ${MODEL_BASE_URL:https://api.openai.com/v1}
  model-api-key: ${MODEL_API_KEY:}
  chat-model: ${CHAT_MODEL:gpt-4o-mini}
  model-timeout-seconds: ${MODEL_TIMEOUT_SECONDS:25}
  # auto preserves demo/openai behavior; DeepSeek chat defaults to local embeddings.
  embedding-mode: ${EMBEDDING_MODE:auto}
  embedding-base-url: ${EMBEDDING_BASE_URL:}
  embedding-api-key: ${EMBEDDING_API_KEY:}
  embedding-model: ${EMBEDDING_MODEL:demo-character-bigram-v1}
  embedding-dimension: ${EMBEDDING_DIMENSION:256}
  model-context-tokens: ${MODEL_CONTEXT_TOKENS:16384}
  top-k: ${TOP_K:5}
  similarity-threshold: ${SIMILARITY_THRESHOLD:0.13}
  retrieval-mode: ${RETRIEVAL_MODE:vector}
  question-timeout-seconds: 60
  task-timeout-seconds: 600
  login-limit: 20
  question-limit: 30
logging:
  level:
    org.apache.pdfbox: ERROR
