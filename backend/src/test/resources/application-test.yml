spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/campus_rag_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  jwt-secret: test-only-jwt-secret-at-least-32-bytes-long
  seed: true
  admin-password: Admin@123456
  student-password: Student@123456
  storage: ./target/test-files
  vector-store: memory
  vector-namespace: campus-test
  model-mode: demo
  embedding-model: demo-character-bigram-v1
  embedding-dimension: 256
  similarity-threshold: 0.13
  login-limit: 10000
  question-limit: 10000
  question-timeout-seconds: 3
logging:
  level:
    root: WARN
    edu.campus.rag: INFO
